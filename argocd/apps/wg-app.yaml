apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wg-app
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: https://github.com/superhellth/k8s-homelab.git
    targetRevision: main
    path: apps/wg-app
  destination:
    server: https://kubernetes.default.svc
    namespace: wg-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: infrastructure
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
    - repoURL: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
      targetRevision: 82.16.0
      path: .
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/infrastructure/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/superhellth/k8s-homelab.git
      targetRevision: main
      ref: values
      path: infrastructure/kube-prometheus-stack/manifests
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions: [".webhooks[]?.clientConfig.caBundle"]
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions: [".webhooks[]?.clientConfig.caBundle"]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

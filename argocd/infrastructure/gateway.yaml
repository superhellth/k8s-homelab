apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/superhellth/k8s-homelab.git
    targetRevision: main
    path: infrastructure/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pg-main
  namespace: argocd
spec:
  project: infrastructure
  destination:
    server: https://kubernetes.default.svc
    namespace: databases
  source:
    repoURL: https://github.com/superhellth/k8s-homelab.git
    targetRevision: main
    path: databases/pg-main

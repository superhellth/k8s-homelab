apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app.kubernetes.io/name: wg-app-api }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app.kubernetes.io/name: wg-app-web }
  ports: [{ name: http, port: 80, targetPort: http }]

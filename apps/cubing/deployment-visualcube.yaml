apiVersion: apps/v1
kind: Deployment
metadata:
  name: cubing-visualcube
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: cubing-visualcube }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cubing-visualcube }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: visualcube
          image: ghcr.io/superhellth/cubing-visualcube
          ports: [{ name: http, containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: "/visualcube.php?fmt=svg", port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: "/visualcube.php?fmt=svg", port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: apache-run, mountPath: /var/run/apache2 }
            - { name: apache-lock, mountPath: /var/lock/apache2 }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
        - { name: apache-run, emptyDir: {} }
        - { name: apache-lock, emptyDir: {} }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: visualcube
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: visualcube }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cubing-frontend }
      ports: [{ port: http }]

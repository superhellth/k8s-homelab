---
apiVersion: v1
kind: Service
metadata:
  name: cubing-frontend
spec:
  selector: { app.kubernetes.io/name: cubing-frontend }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app.kubernetes.io/name: cubing-backend }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: visualcube
spec:
  selector: { app.kubernetes.io/name: visualcube }
  ports: [{ name: http, port: 80, targetPort: http }]

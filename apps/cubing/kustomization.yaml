apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cubing
resources:
  - namespace.yaml
  - deployment-frontend.yaml
  - deployment-backend.yaml
  - sealedsecret-backend.yaml
  - services.yaml
configMapGenerator:
  - name: cubing-backend-config
    literals:
      - DB_USER=cubing
      - DB_HOST=pg-main-rw.databases.svc
      - DB_NAME=cubing
      - DB_PORT=5432

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources:
  - deployment-frontend.yaml
  - deployment-backend.yaml
  - deployment-visualcube.yaml
  - sealedsecret-backend.yaml
  - services.yaml
  - httproute.yaml
images:
  - name: ghcr.io/superhellth/cubing-frontend
    newTag: 1.2.1
  - name: ghcr.io/superhellth/cubing-frontend
    newTag: 1.2.1
  - name: ghcr.io/superhellth/cubing-frontend
    newTag: 1.2.1
configMapGenerator:
  - name: cubing-backend-config
    literals:
      - DB_USER=cubing
      - DB_HOST=pg-main-rw.databases.svc
      - DB_NAME=cubing
      - DB_PORT=5432

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.yaml
patches:
  - target:
      kind: Deployment
      name: cert-manager
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cert-manager
      spec:
        template:
          spec:
            containers:
              - name: cert-manager-controller
                resources:
                  requests: { cpu: 10m, memory: 96Mi }
                  limits: { memory: 192Mi }
  - target:
      kind: Deployment
      name: cert-manager-cainjector
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cert-manager-cainjector
      spec:
        template:
          spec:
            containers:
              - name: cert-manager-cainjector
                resources:
                  requests: { cpu: 10m, memory: 64Mi }
                  limits: { memory: 128Mi }
  - target:
      kind: Deployment
      name: cert-manager-webhook
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cert-manager-webhook
      spec:
        template:
          spec:
            containers:
              - name: cert-manager-webhook
                resources:
                  requests: { cpu: 10m, memory: 64Mi }
                  limits: { memory: 128Mi }

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/bitnami/sealed-secrets/releases/download/v0.40.0/controller.yaml
patches:
  - target:
      kind: Deployment
      name: sealed-secrets-controller
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sealed-secrets-controller
      spec:
        template:
          spec:
            containers:
              - name: sealed-secrets-controller
                resources:
                  requests: { cpu: 10m, memory: 64Mi }
                  limits: { memory: 128Mi }

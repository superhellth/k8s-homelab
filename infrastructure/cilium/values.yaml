# Talos: pod CIDRs come from the node objects
ipam:
  mode: kubernetes

# Replace kube-proxy with eBPF service handling. Without kube-proxy the
# "kubernetes" Service can't be resolved yet, so reach the API server through
# KubePrism (Talos' node-local API load balancer).
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445

# Talos mounts cgroupv2 itself and forbids loading kernel modules.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
securityContext:
  capabilities:
    ciliumAgent:
      [
        CHOWN,
        KILL,
        NET_ADMIN,
        NET_RAW,
        IPC_LOCK,
        SYS_ADMIN,
        SYS_RESOURCE,
        DAC_OVERRIDE,
        FOWNER,
        SETGID,
        SETUID,
        SYSLOG,
      ]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 1Gi }

operator:
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }

l2announcements:
  enabled: true
# L2 announcements hold one Lease per service and renew it constantly;
# the default client budget (10 qps / 20 burst) is shared with everything else the agent does.
k8sClientRateLimit:
  qps: 20
  burst: 40
gatewayAPI:
  enabled: true

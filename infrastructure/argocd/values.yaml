global:
  domain: argocd.superhellth.com

dex:
  enabled: false
notifications:
  enabled: false

controller:
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 512Mi }
repoServer:
  resources:
    requests: { cpu: 20m, memory: 128Mi }
    limits: { memory: 512Mi } # rendering spikes (kube-prometheus-stack in phase 2)
server:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 192Mi }
applicationSet:
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 128Mi }
redis:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
redisSecretInit:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }

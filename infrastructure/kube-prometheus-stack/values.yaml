kubeEtcd:
  # Keep enabled: this flag also gates the etcd PrometheusRules and the Grafana dashboard.
  # Scraping is done by manifests/scrapeconfig-etcd.yaml (static target, no Service/Endpoints).
  service:
    enabled: false
  serviceMonitor:
    enabled: false
grafana:
  admin:
    existingSecret: grafana-admin
  grafana.ini:
    server:
      root_url: https://grafana.superhellth.com
  persistence:
    enabled: true
    storageClassName: local-path
    size: 1Gi
  initChownData:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 8GB
    nodeSelector:
      kubernetes.io/hostname: talos-i
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits: { memory: 2Gi }
prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 256Mi }
prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
kubeProxy:
  enabled: false

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: main
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - grafana.superhellth.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
          group: ""
          kind: Service
          weight: 1

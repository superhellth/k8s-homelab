apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.15.1/manifest.yaml
patches:
  - target:
      kind: Deployment
      name: barman-cloud
      namespace: cnpg-system
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/args/6
        value: --log-level=debug
      - op: replace
        path: /spec/template/spec/containers/0/args/6
        value: --log-level=error
  - target:
      kind: Deployment
      name: barman-cloud
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: barman-cloud
      spec:
        template:
          spec:
            containers:
              - name: barman-cloud
                resources:
                  requests: { cpu: 10m, memory: 32Mi }
                  limits: { memory: 64Mi }

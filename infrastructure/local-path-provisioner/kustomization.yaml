apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/rancher/local-path-provisioner/deploy?ref=v0.0.37
patches:
  - path: patch-namespace.yaml
  - path: patch-config.yaml
  - path: patch-storageclass.yaml
  - target:
      kind: Deployment
      name: local-path-provisioner
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: local-path-provisioner
      spec:
        template:
          spec:
            containers:
              - name: local-path-provisioner
                resources:
                  requests: { cpu: 10m, memory: 32Mi }
                  limits: { memory: 64Mi }

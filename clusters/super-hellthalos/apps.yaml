---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wg-app
  namespace: flux-system
spec:
  dependsOn:
    - name: pg-main
    - name: sealed-secrets
    - name: gateway
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/wg-app
  prune: false
  wait: true

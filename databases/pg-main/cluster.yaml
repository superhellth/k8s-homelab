apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-main
  namespace: databases
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie

  managed:
    roles:
      - name: wg_app
        ensure: present
        login: true
        passwordSecret:
          name: pg-main-wg-app

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: r2-store

  affinity:
    podAntiAffinityType: required

  storage:
    storageClass: local-path
    size: 50Gi

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 1Gi

  postgresql:
    parameters:
      shared_buffers: 256MB

  bootstrap:
    initdb:
      database: app
      owner: app
